# Vitis HLS 2025.2 component config - matrix multiply IP.
#
# Vitis HLS Classic was removed in 2025.1, so this is the config-file flow
# driven by `v++ -c --mode hls` / `vitis-run --mode hls`; open_project and
# open_solution no longer apply.  See hls/Makefile for the invocations.
#
# part: PYNQ-Z1 and PYNQ-Z2 both carry xc7z020clg400-1.  Override with
#       `make PART=<part>` if you are on different silicon.

part=xc7z020clg400-1

[hls]
flow_target=vivado
clock=10
clock_uncertainty=12.5%

syn.top=mat_mul_kernel
syn.file=../src/matmul.cpp
syn.cflags=-I../include -std=c++14

tb.file=../tb/tb_matmul.cpp
tb.file=../tb/vectors
tb.cflags=-I../include -I../tb -std=c++14

package.output.format=ip_catalog
package.output.syn=true
