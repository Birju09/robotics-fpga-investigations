# Vitis HLS 2025.2 component config - capsule self-collision distance IP.
#
# Stage 0 of docs/collision_aware_ik.md, and the go/no-go for the whole
# nullspace plan: this IP exists to establish what a fixed-point capsule
# distance query COSTS, in area and latency, before ik_dls commits to
# carrying one per iteration.  Build it, read `make -C hls reports`, and
# compare the area against what section 7 of that document says is left on
# this part - which is very little.
#
# Unlike ik_dls_kernel, every loop here has a compile-time trip count
# (IK_CAP_COUNT capsules, IK_COLL_PAIR_COUNT pairs, IK_DOF chain steps, all
# from the generated tables) and the clamp cascade is branch-free, so
# C-synthesis should report a single latency rather than a range.  A range in
# the report means a data-dependent exit crept in, and that would be a bug
# rather than a finding - the opposite of ik_dls, where the range IS the
# result.
#
# See cfg/matmul.cfg for notes on the flow and the part choice.

part=xc7z020clg400-1

[hls]
flow_target=vivado
clock=10
clock_uncertainty=12.5%

syn.top=coll_dist_kernel
syn.file=../src/coll.cpp
syn.file=../src/kinematics.cpp
syn.cflags=-I../include -std=c++14

tb.file=../tb/tb_coll.cpp
tb.file=../tb/vectors
tb.cflags=-I../include -I../tb -std=c++14

package.output.format=ip_catalog
package.output.syn=true
