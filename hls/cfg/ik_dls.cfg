# Vitis HLS 2025.2 component config - damped least squares IK IP.
#
# The DLS_ITER loop keeps a data-dependent exit, so C-synthesis reports its
# latency as a range rather than a number.  That range - not a single figure -
# is the result this IP exists to produce.  Read the min/max/avg columns of the
# synthesis report together with the iteration histogram that tb_ik_dls prints.
#
# See cfg/matmul.cfg for notes on the flow and the part choice.

part=xc7z020clg400-1

[hls]
flow_target=vivado
clock=10
clock_uncertainty=12.5%

syn.top=ik_dls_kernel
syn.file=../src/ik_dls.cpp
syn.file=../src/kinematics.cpp
syn.file=../src/matmul.cpp
syn.file=../src/matinv.cpp
syn.cflags=-I../include -std=c++14

tb.file=../tb/tb_ik_dls.cpp
tb.file=../tb/vectors
tb.cflags=-I../include -I../tb -std=c++14

package.output.format=ip_catalog
package.output.syn=true
