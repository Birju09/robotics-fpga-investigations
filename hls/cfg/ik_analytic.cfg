# Vitis HLS 2025.2 component config - closed-form IK IP.
#
# This is the fixed-latency reference in the comparison: every loop in the
# synthesised path has a compile-time trip count, so the "Latency" figure in
# the C-synthesis report is also the worst-case execution time.
#
# See cfg/matmul.cfg for notes on the flow and the part choice.

part=xc7z020clg400-1

[hls]
flow_target=vivado
clock=10
clock_uncertainty=12.5%

syn.top=ik_analytic_kernel
syn.file=../src/ik_analytic.cpp
syn.file=../src/kinematics.cpp
syn.cflags=-I../include -std=c++14

tb.file=../tb/tb_ik_analytic.cpp
tb.file=../tb/vectors
tb.cflags=-I../include -I../tb -std=c++14

package.output.format=ip_catalog
package.output.syn=true
